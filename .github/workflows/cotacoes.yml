name: Atualizar cotações

on:
  schedule:
    - cron: "0 12-22 * * 1-5"   # a cada hora em dias úteis (horário UTC)
    - cron: "0 3 * * *"         # uma vez por dia, de madrugada
  workflow_dispatch:            # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: cotacoes
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/cotacoes.py
      - name: Publicar cotacoes.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cotacoes.js
          git diff --cached --quiet || (git commit -m "Atualiza cotações" && git push)
